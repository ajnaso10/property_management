{% extends "templates/web.html" %}

{% block title %}Change password{% endblock %}

{% block page_content %}
<main class="property-password">
	<h1>Change your password</h1>
	<p>This account is using a password issued by the Property Super Admin. Set your own password before opening the desk.</p>
	<form id="property-password-form">
		<label for="old-password">Current password</label>
		<input id="old-password" name="old_password" type="password" autocomplete="current-password" required>
		<label for="new-password">New password</label>
		<input id="new-password" name="new_password" type="password" autocomplete="new-password" required>
		<button type="submit">Save password</button>
		<p id="property-password-error" role="alert"></p>
	</form>
</main>
<style>
	.property-password {
		max-width: 28rem;
		margin: 4rem auto;
		font-family: inherit;
	}
	.property-password h1 {
		font-size: 1.6rem;
		margin-bottom: 0.5rem;
	}
	.property-password label {
		display: block;
		margin-top: 1rem;
		font-weight: 600;
	}
	.property-password input {
		width: 100%;
		margin-top: 0.35rem;
		padding: 0.6rem 0.7rem;
	}
	.property-password button {
		margin-top: 1.25rem;
	}
	#property-password-error {
		color: var(--red-600, #b42318);
		min-height: 1.25rem;
	}
</style>
<script>
	const form = document.getElementById("property-password-form");
	const error = document.getElementById("property-password-error");
	form.addEventListener("submit", async (event) => {
		event.preventDefault();
		error.textContent = "";
		const body = new URLSearchParams({
			old_password: document.getElementById("old-password").value,
			new_password: document.getElementById("new-password").value,
		});
		const response = await fetch("/api/method/property_management.api.change_own_password", {
			method: "POST",
			headers: {
				"Content-Type": "application/x-www-form-urlencoded",
				"X-Frappe-CSRF-Token": "{{ csrf_token }}",
				Accept: "application/json",
			},
			body,
		});
		const payload = await response.json().catch(() => ({}));
		if (!response.ok || payload.exc) {
			let message = payload.message || "The password was not changed.";
			try {
				const serverMessages = JSON.parse(payload._server_messages || "[]");
				if (serverMessages.length) {
					message = JSON.parse(serverMessages[0]).message || message;
				}
			} catch (parseError) {
				message = payload.message || message;
			}
			error.textContent = message.replace(/<[^>]*>/g, "");
			return;
		}
		window.location.replace({{ desk_home | tojson }});
	});
</script>
{% endblock %}
